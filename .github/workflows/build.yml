name: Build AU Mod APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download BepInEx + Il2CppInterop DLLs
        run: |
          mkdir -p libs/game

          wget -q "https://www.nuget.org/api/v2/package/BepInEx.Core/6.0.0-be.674" -O bepcore.zip
          unzip -q bepcore.zip -d bepcore
          find bepcore -name "BepInEx.Core.dll" | head -1 | xargs -I{} cp {} libs/
          rm -rf bepcore bepcore.zip

          wget -q "https://www.nuget.org/api/v2/package/BepInEx.Unity.IL2CPP/6.0.0-be.674" -O bepil2cpp.zip
          unzip -q bepil2cpp.zip -d bepil2cpp
          find bepil2cpp -name "BepInEx.Unity.IL2CPP.dll" | head -1 | xargs -I{} cp {} libs/
          rm -rf bepil2cpp bepil2cpp.zip

          wget -q "https://www.nuget.org/api/v2/package/Il2CppInterop.Runtime/1.4.5" -O interop.zip
          unzip -q interop.zip -d interop
          find interop -name "Il2CppInterop.Runtime.dll" | head -1 | xargs -I{} cp {} libs/
          rm -rf interop interop.zip

          wget -q "https://www.nuget.org/api/v2/package/HarmonyX/2.10.1" -O harmony.zip
          unzip -q harmony.zip -d harmony
          find harmony -name "0Harmony.dll" | head -1 | xargs -I{} cp {} libs/
          rm -rf harmony harmony.zip

          echo "[LIBS]:" && ls libs/

      - name: Download Among Us Game DLLs
        run: |
          wget -q "https://www.nuget.org/api/v2/package/AmongUs.GameLibs.Steam/2024.9.4" -O gamelibs.zip 2>/dev/null || \
          wget -q "https://www.nuget.org/api/v2/package/AmongUs.GameLibs.Steam/2024.6.18" -O gamelibs.zip

          unzip -q gamelibs.zip -d gamelibs
          find gamelibs -name "Assembly-CSharp.dll" | head -1 | xargs -I{} cp {} libs/game/
          find gamelibs -name "UnityEngine.CoreModule.dll" | head -1 | xargs -I{} cp {} libs/game/
          find gamelibs -name "UnityEngine.IMGUIModule.dll" | head -1 | xargs -I{} cp {} libs/game/
          rm -rf gamelibs gamelibs.zip

          echo "[GAME LIBS]:" && ls libs/game/

      - name: Build DLL
        run: dotnet build AUModMenu.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AUModMenu-dll
          path: bin/Release/net6.0/AUModMenu.dll
