name: Build AU Mod APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add NuGet source BepInEx
        run: dotnet nuget add source "https://nuget.bepinex.dev/v3/index.json" --name BepInEx

      - name: Build DLL
        run: dotnet build AUModMenu.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AUModMenu-dll
          path: bin/Release/net6.0/AUModMenu.dll
